```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto vs Sasuke</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
transition:transform 0.05s;
}

#v_src,#out{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
transform:scaleX(-1);
}

#out{
z-index:2;
pointer-events:none;
}

.darkness{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;
background:rgba(10,5,0,0.3);
mix-blend-mode:multiply;
pointer-events:none;
z-index:5;
}

.fx{
position:absolute;
top:0;
left:0;
transform:translate(-50%,-50%);
pointer-events:none;
display:none;
mix-blend-mode:screen;
z-index:20;
height:auto;
}

#n{
width:1600px;
filter:brightness(1.6) contrast(1.3) saturate(1.4);
}

#s{
width:2400px;
filter:brightness(1.4) contrast(1.4) saturate(1.5);
}

.glow{
position:absolute;
width:260px;
height:260px;
border-radius:50%;
pointer-events:none;
display:none;
transform:translate(-50%,-50%);
z-index:15;

background:radial-gradient(circle,
rgba(255,255,255,1) 0%,
rgba(120,200,255,0.9) 20%,
rgba(0,150,255,0.7) 40%,
rgba(0,100,255,0.4) 60%,
rgba(0,0,0,0) 75%);

filter:blur(18px);
mix-blend-mode:screen;
}

.blue{
background:radial-gradient(circle,
rgba(255,255,255,1) 0%,
rgba(150,220,255,0.9) 20%,
rgba(0,200,255,0.7) 40%,
rgba(0,150,255,0.5) 60%,
rgba(0,0,0,0) 75%);
}

</style>
</head>

<body>

<video id="v_src" autoplay playsinline></video>
<canvas id="out"></canvas>

<div class="darkness"></div>

<div id="rasenganGlow" class="glow"></div>
<div id="chidoriGlow" class="glow blue"></div>

<video id="n" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
<video id="s" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>

<script>

const vElement=document.getElementById("v_src")
const cElement=document.getElementById("out")
const ctx=cElement.getContext("2d")

const n=document.getElementById("n")
const s=document.getElementById("s")

const rasenganGlow=document.getElementById("rasenganGlow")
const chidoriGlow=document.getElementById("chidoriGlow")

/* SOUND */

const rasenganSound=new Audio("assets/rasengan.mp3")
const chidoriSound=new Audio("assets/chidori.mp3")

rasenganSound.volume=0.6
chidoriSound.volume=0.6

let pwr=[0,0]
let wasOpen=[false,false]

function checkOpen(pts){

let count=0
const wrist=pts[0]

const tips=[8,12,16,20]
const pips=[6,10,14,18]

for(let i=0;i<tips.length;i++){

const tip=pts[tips[i]]
const pip=pts[pips[i]]

if(Math.hypot(tip.x-wrist.x,tip.y-wrist.y)>
Math.hypot(pip.x-wrist.x,pip.y-wrist.y))
count++

}

return count>=3
}

function onResults(res){

cElement.width=vElement.videoWidth
cElement.height=vElement.videoHeight

ctx.clearRect(0,0,cElement.width,cElement.height)

let fL=false
let fR=false

n.style.display="none"
s.style.display="none"

if(res.multiHandLandmarks && res.multiHandedness){

res.multiHandLandmarks.forEach((pts,i)=>{

const label=res.multiHandedness[i].label
const isR=label==="Right"
const idx=isR?1:0

ctx.shadowBlur=10
ctx.shadowColor="#00fbff"

drawConnectors(ctx,pts,Hands.HAND_CONNECTIONS,{
color:"#00d4ff",
lineWidth:3
})

drawLandmarks(ctx,pts,{
color:"#ffffff",
lineWidth:1,
radius:2
})

const open=checkOpen(pts)

pwr[idx]+=open?0.05:-0.15
pwr[idx]=Math.max(0,Math.min(1,pwr[idx]))

if(open && !wasOpen[idx]){

const vid=isR?s:n
vid.currentTime=0
vid.play()

if(isR){
chidoriSound.currentTime=0
chidoriSound.play()
}else{
rasenganSound.currentTime=0
rasenganSound.play()
}

}

wasOpen[idx]=open

const wrist=pts[0]
const knk=pts[9]

if(pwr[idx]>0.01){

if(isR){

fR=true

const tx=(wrist.x+knk.x)/2
const ty=(wrist.y+knk.y)/2

const x=(1-tx)*window.innerWidth
const y=ty*window.innerHeight

s.style.left=x+"px"
s.style.top=y+"px"
s.style.display="block"
s.style.opacity=pwr[idx]

chidoriGlow.style.left=x+"px"
chidoriGlow.style.top=y+"px"
chidoriGlow.style.display="block"
chidoriGlow.style.opacity=pwr[idx]

}else{

fL=true

const dx=knk.x-wrist.x
const dy=knk.y-wrist.y

const tx=knk.x+(dx*0.8)
const ty=knk.y+(dy*0.8)

const x=(1-tx)*window.innerWidth
const y=(ty*window.innerHeight)-120

n.style.left=x+"px"
n.style.top=y+"px"
n.style.display="block"
n.style.opacity=pwr[idx]

rasenganGlow.style.left=x+"px"
rasenganGlow.style.top=y+"px"
rasenganGlow.style.display="block"
rasenganGlow.style.opacity=pwr[idx]

}

/* camera shake */

if(pwr[idx]>0.7){

document.body.style.transform=
`translate(${(Math.random()-0.5)*6}px,${(Math.random()-0.5)*6}px)`

}else{

document.body.style.transform="translate(0,0)"

}

}

})

}

/* STOP SOUND WHEN HAND DISAPPEARS */

if(!fL){

rasenganGlow.style.display="none"

rasenganSound.pause()
rasenganSound.currentTime=0

pwr[0]=Math.max(0,pwr[0]-0.15)

if(pwr[0]>0.01){
n.style.display="block"
n.style.opacity=pwr[0]
}

wasOpen[0]=false

}

if(!fR){

chidoriGlow.style.display="none"

chidoriSound.pause()
chidoriSound.currentTime=0

pwr[1]=Math.max(0,pwr[1]-0.15)

if(pwr[1]>0.01){
s.style.display="block"
s.style.opacity=pwr[1]
}

wasOpen[1]=false

}

}

const h=new Hands({
locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
})

h.setOptions({
maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.65,
minTrackingConfidence:0.65
})

h.onResults(onResults)

const cam=new Camera(vElement,{
onFrame:async()=>{
await h.send({image:vElement})
},
width:1280,
height:720
})

cam.start()

</script>

</body>
</html>
```
